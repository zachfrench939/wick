name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Set wickquiz.com and enforce HTTPS
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          repo="${{ github.repository }}"
          echo "Setting custom domain"
          set +e
          put_out=$(gh api --method PUT "repos/${repo}/pages" --input - <<'EOF'
          {"cname":"wickquiz.com"}
          EOF
          )
          put_status=$?
          set -e
          echo "$put_out"
          if [ "$put_status" -ne 0 ]; then
            echo "PUT /pages cname failed with status ${put_status}"
            exit "$put_status"
          fi
          for i in $(seq 1 45); do
            json=$(gh api "repos/${repo}/pages")
            state=$(printf '%s' "$json" | jq -r '.https_certificate.state // empty')
            echo "poll ${i} certificate=${state}"
            printf '%s\n' "$json" | jq '{status,cname,https_enforced,html_url,public,https_certificate,protected_domain_state}'
            if [ "$state" = "approved" ]; then
              gh api --method PUT "repos/${repo}/pages" --input - <<'EOF'
          {"cname":"wickquiz.com","https_enforced":true}
          EOF
              exit 0
            fi
            sleep 20
          done
          echo "Certificate was not approved within 15 minutes"
          exit 1
